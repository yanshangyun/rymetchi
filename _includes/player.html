<audio id="{{ include.id }}" preload="metadata">
    <source src="{{ include.src }}" type="audio/mpeg">
</audio>
<div class="player" data-for="{{ include.id }}">
    <button class="player-play">▶</button>
    <span class="player-time player-current">0:00</span>
    <input class="player-seek" type="range" min="0" max="100" value="0" step="0.1">
    <span class="player-time player-duration">—</span>
</div>
